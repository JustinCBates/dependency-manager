[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dependency-manager"
version = "0.1.0"
description = "Centralized dependency management for OpenProject multi-repository ecosystem"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Justin Bates", email = "justin@justinbates.dev"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License", 
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
requires-python = ">=3.8"
dependencies = [
    "click>=8.0",
    "pyyaml>=6.0",
    "requests>=2.28.0",
    "packaging>=21.0",
    "rich>=13.0.0",
    "toml>=0.10.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=22.0", 
    "flake8>=5.0",
    "mypy>=1.0"
]
security = [
    "safety>=2.0.0",
    "bandit>=1.7.0"
]
analysis = [
    "pipdeptree>=2.0.0",
    "pip-audit>=2.0.0"
]

[project.urls]
Homepage = "https://github.com/JustinCBates/dependency-manager"
Repository = "https://github.com/JustinCBates/dependency-manager"
Documentation = "https://github.com/JustinCBates/dependency-manager#readme"
Issues = "https://github.com/JustinCBates/dependency-manager/issues"

[project.scripts]
dependency-manager = "dependency_manager.cli:main"

[tool.black]
line-length = 100
target-version = ['py38']

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true